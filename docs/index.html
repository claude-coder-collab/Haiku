<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku Hinter</title>
<link rel="stylesheet" href="style.css">
<style>
main.wide { max-width: 1100px; }
.layout { display: grid; grid-template-columns: minmax(300px, 520px) minmax(0, 1fr); gap: 16px; align-items: start; }
.layout > section, .side { min-width: 0; }
.side { display: grid; gap: 16px; }
.side > section { margin-bottom: 0; }
[hidden] { display: none !important; }
.boardcard { position: sticky; top: 8px; }
.compact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.compact button { padding: 6px 10px; font-size: 0.9rem; }
.compact label { font-size: 0.9rem; display: inline-flex; gap: 6px; align-items: center; }
#explain { overflow-wrap: anywhere; }
@media (max-width: 860px) {
  main.wide { padding: 12px 8px 32px; }
  h1 { font-size: 1.3rem; }
  p.lead { display: none; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .compact { gap: 6px; margin-top: 6px; }
  .boardcard { position: static; top: 0; z-index: 5; padding: 6px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12); }
  #board { width: 100%; max-width: none; }
  #explain { margin: 6px 0 0; font-size: 0.85rem; min-height: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #steps { max-height: none; overflow: visible; }
  .step { font-size: 0.85rem; }
}
@media (max-width: 860px) {
  body.loaded nav, body.loaded h1, body.loaded .compact, body.loaded #explain, body.loaded .opts, body.loaded .filterrow, body.loaded .stepshead, body.loaded main > p.note { display: none; }
  body.loaded main.wide { padding-top: 8px; }
  body.loaded .boardcard { margin-bottom: 0; }
  body.loaded .side > section { border: 0; padding: 0; background: none; }
  body.loaded .side { gap: 0; }
}
.searching { padding: 8px 4px; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 860px) and (min-height: 780px) {
  .boardcard { position: sticky; }
}
#board { width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; }
#board text { font-family: inherit; }
.cellbg { fill: var(--card); }
.cellbg.sel { fill: rgba(31, 111, 235, 0.18); }
.hl-idx { fill: rgba(240, 200, 60, 0.35); }
.hl-base { fill: rgba(60, 140, 240, 0.18); }
.hl-cover { fill: rgba(240, 140, 60, 0.18); }
.hl-set { fill: rgba(60, 180, 90, 0.35); }
.als0 { fill: rgba(60, 180, 90, 0.22); }
.als1 { fill: rgba(60, 140, 240, 0.22); }
.als2 { fill: rgba(200, 90, 200, 0.22); }
.als3 { fill: rgba(240, 160, 60, 0.22); }
.col0 { fill: rgba(60, 180, 90, 0.3); }
.col1 { fill: rgba(240, 160, 60, 0.3); }
.val { fill: var(--fg); font-size: 34px; text-anchor: middle; dominant-baseline: central; }
.val.user { fill: var(--accent); }
.val.setv { fill: #1f9d4d; font-weight: 700; }
.cand { fill: var(--muted); font-size: 13px; text-anchor: middle; dominant-baseline: central; }
.cand.pat { fill: #fff; }
.cand.del { fill: #fff; }
.cand.fin { fill: #fff; }
.cand.endo { fill: #fff; }
.cand.cann { fill: #fff; }
.cand.node { fill: var(--fg); font-weight: 700; }
.dot.pat { fill: #1f9d4d; }
.dot.del { fill: #d6334a; }
.dot.fin { fill: #2f7bd8; }
.dot.endo { fill: #9a4fd0; }
.dot.cann { fill: #8a1020; }
.dot.node { fill: rgba(60, 140, 240, 0.3); }
.link { stroke: #2f7bd8; stroke-width: 2.2; fill: none; }
.link.weak { stroke-dasharray: 5 4; stroke: #c07a1a; }
.grid-thin { stroke: var(--line); stroke-width: 1; }
.grid-thick { stroke: var(--fg); stroke-width: 2.4; }
#steps { max-height: 640px; overflow: auto; }
.group { margin-bottom: 10px; }
.ghead { font-weight: 600; font-size: 0.92rem; padding: 4px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.ghead span { color: var(--muted); font-weight: 400; }
.ghead > div { flex: 1; }
.ghead { align-items: center; gap: 10px; }
.applyall { padding: 3px 10px; font-size: 0.85rem; }
.step > div { min-width: 0; overflow-wrap: anywhere; }
.step { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.step:hover { background: rgba(31, 111, 235, 0.08); }
.step.on { background: rgba(31, 111, 235, 0.16); }
.step button { padding: 3px 10px; font-size: 0.85rem; }
textarea { width: 100%; font: inherit; font-family: ui-monospace, Menlo, monospace; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.explain { margin: 10px 0 0; font-size: 0.95rem; min-height: 1.5em; }
</style>
</head>
<body>
<main class="wide">
  <nav><a class="here" href="./">Hinter</a><a href="generator.html">Generator</a></nav>
  <h1>Sudoku Hinter</h1>

  <div class="layout">
    <section class="boardcard">
      <svg id="board" viewBox="0 0 504 504" aria-label="Sudoku board"></svg>
      <p class="explain" id="explain"></p>
      <div class="compact">
        <button id="apply" class="primary" type="button" disabled>Apply</button>
        <button id="undo" type="button" disabled>Undo</button>
        <button id="redo" type="button" disabled>Redo</button>
        <button id="refill" type="button" title="Reset candidates">Reset</button>
        <label><input id="pencil" type="checkbox"> Pencil</label>
      </div>
    </section>

    <div class="side">
      <section id="puzzlePanel">
        <h2>Puzzle</h2>
        <textarea id="puzzle" rows="3" placeholder="Paste 81 characters, or 9 lines. Use . or 0 for empty cells."></textarea>
        <div class="row" style="margin-top:10px">
          <button id="load" class="primary" type="button">Load</button>
        </div>
        <p class="note">Click a cell and type a digit to place it. Shift+digit, or Pencil mode, toggles a candidate. Delete clears a value and resets candidates.</p>
      </section>

      <section>
        <h2 class="stepshead">Available steps <span class="note" id="progress"></span></h2>
        <div class="row opts" style="margin-bottom:8px">
          <label class="cell"><input id="heavy" type="checkbox"> Include slow searches (Kraken fish, forcing chains and nets)</label>
        </div>
        <div class="row filterrow" style="margin-bottom:8px">
          <input id="filter" type="search" placeholder="Filter, e.g. wing" style="flex:1;padding:8px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px">
        </div>
        <div id="steps"></div>
      </section>
    </div>
  </div>

  <p class="note">Built from <a href="https://hodoku.sourceforge.net/">HoDoKu</a> 2.2.0 by Bernhard Hobiger (GPLv3), compiled to WebAssembly with <a href="https://teavm.org/">TeaVM</a>.</p>
</main>
<script src="hinter.js"></script>
</body>
</html>
